syntax = "proto3";

option csharp_namespace = "Chat.Protos";
package chat;

// Client <-> Gateway 的 wire 封包格式：連線本身的信封，不含業務語意。
message Packet {
	string subject = 1;
	bytes payload = 2;
}

// 上層 -> OutboundGateway -> Dispatcher：未分組的投遞請求。
message DeliverRequest {
	string subject = 1;
	repeated string connection_ids = 2;
	bytes payload = 3;
}

// Dispatcher -> Gateway：已依 NodeId 分組後的投遞封包。
message DeliverPacket {
	string subject = 1;
	repeated string connection_ids = 2;
	bytes payload = 3;
}

// 上層 -> IConnectionTerminator -> Dispatcher：未分組的終止請求。
message TerminateRequest {
	repeated string connection_ids = 1;
}

// Dispatcher -> Gateway：已依 NodeId 分組後的終止封包。
message TerminatePacket {
	repeated string connection_ids = 1;
}

// Gateway -> 上層：某條連線已經關閉。
// best-effort，不保證送達（process 被 kill 時發不出來），訂閱端不能只依賴它。
//
// principal 是 handshake 驗證通過的不透明字串。帶上它，訂閱端就不需要為了知道「是誰
// 斷線了」而維護一張 connectionId -> 身分的反向索引。
message ConnectionDisconnected {
	string connection_id = 1;
	string node_id = 2;
	string principal = 3;
}
