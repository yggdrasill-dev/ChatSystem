syntax = "proto3";

option csharp_namespace = "Chat.Protos";
package chat;

// Gateway（InboundBridge）-> CommandRouter：一則來自 client 的封包，附上它來自哪條連線、
// 以及那條連線在 handshake 驗證通過的 principal。
//
// principal 由 Gateway 填寫、CommandRouter 無條件相信。這個信任假設成立的前提是
// command.inbound 只有 Gateway 能 publish（叢集內部的 NATS，未對外開放）。
message InboundPacket {
	string connection_id = 1;
	string subject = 2;
	bytes payload = 3;
	string principal = 4;
}

// CommandRouter -> Gateway（InboundBridge）：處理結果。
// 只用於順序控制與觀測，Gateway 不依據它做任何動作（見 protocol-layer.md ADR-5）。
message InboundAck {
	enum Status {
		// OK 刻意不是 0。proto3 不序列化預設值，所以 status=OK + detail="" 的 ack 會是
		// **0 bytes**，而一個空 payload 的回覆跟「根本沒有人回覆」（NATS no-responders）
		// 無法區分——而後者代表這則命令根本沒被處理，是必須讓連線斷掉的情況。
		//
		// 這個 bug 在 registry 還是空的時候完全看不到：那時每則命令的 ack 都是
		// UNKNOWN_SUBJECT（非預設值），有 bytes。第一個成功的命令才會踩到。
		UNSPECIFIED = 0;
		OK = 1;
		UNKNOWN_SUBJECT = 2;
		MALFORMED_PAYLOAD = 3;
		HANDLER_FAILED = 5;

		// 4 曾經是 REJECTED_BY_FILTER。IInboundFilter 整個機制已移除（見 protocol-layer.md
		// ADR-6），保留編號避免日後被重用成別的意思——rolling deploy 期間舊 CommandRouter
		// 仍可能送出 4，而 Gateway 不依據 ack 做任何動作（ADR-5），所以無害。
		reserved 4;
		reserved "REJECTED_BY_FILTER";
	}

	Status status = 1;
	string detail = 2;
}
